name: Add package

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install createrepo_c and rpm tools
        run: sudo apt-get install -y createrepo-c rpm

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
          # Write passphrase to temp file; rpmsign and gpg read it via --passphrase-file
          printf '%s' "$GPG_PASSPHRASE" > /tmp/gpg-passphrase.txt
          chmod 600 /tmp/gpg-passphrase.txt
          # %__gpg_sign_cmd overrides how rpmsign invokes gpg: loopback mode,
          # passphrase from file — no TTY or agent needed in CI.
          {
            echo "%_gpg_path $HOME/.gnupg"
            echo "%_gpg_name kevin.inscoe@gmail.com"
            echo "%_signature gpg"
            echo "%__gpg /usr/bin/gpg"
            echo "%__gpg_sign_cmd /usr/bin/gpg --batch --no-verbose --no-armor --no-tty --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase.txt -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}"
          } > ~/.rpmmacros

      - name: Download, sign, and add .rpm files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rpms packages
          gh release download "${{ github.event.client_payload.tag }}" \
            --repo "${{ github.event.client_payload.repo }}" \
            --pattern "*.rpm" \
            --dir /tmp/rpms
          for rpm in /tmp/rpms/*.rpm; do
            rpmsign --addsign "$rpm"
            cp "$rpm" packages/
          done

      - name: Regenerate repo metadata
        run: createrepo_c --update .

      - name: Sign repo metadata
        run: |
          gpg --batch --no-tty --pinentry-mode loopback \
              --passphrase-file /tmp/gpg-passphrase.txt \
              --detach-sign --armor repodata/repomd.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "add ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.tag }}"
          git push
