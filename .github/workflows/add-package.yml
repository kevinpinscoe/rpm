name: Add package

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install createrepo_c and rpm tools
        run: sudo apt-get install -y createrepo-c rpm

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg ~/.local/bin && chmod 700 ~/.gnupg

          # Custom pinentry: reads passphrase from ~/.gnupg/.pinentry-pass.
          # Used by the gpg-agent when rpmsign triggers a signing operation.
          echo "" \
            | base64 -d > ~/.local/bin/pinentry-env
          chmod +x ~/.local/bin/pinentry-env

          # Write passphrase; strip trailing \r or \n (secret stores append one)
          printf '%s' "$GPG_PASSPHRASE" | tr -d '\r\n' > ~/.gnupg/.pinentry-pass
          chmod 600 ~/.gnupg/.pinentry-pass

          # Kill any stale agent; write config; relaunch with custom pinentry
          gpgconf --kill gpg-agent 2>/dev/null || true
          SOCK=$(gpgconf --list-dirs agent-socket 2>/dev/null || true)
          [ -n "$SOCK" ] && timeout 3 bash -c "while [ -S '$SOCK' ]; do sleep 0.1; done" || true
          printf 'pinentry-program %s/.local/bin/pinentry-env\n' "$HOME" > ~/.gnupg/gpg-agent.conf
          gpgconf --launch gpg-agent

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust

          # rpmsign's default %__gpg_sign_cmd passes --passphrase-fd 3 and
          # --pinentry-mode loopback to gpg, both of which fail in CI without a TTY.
          # Ubuntu's rpm ignores %__gpg_sign_cmd / %__gpg macro overrides in ~/.rpmmacros.
          # Replace /usr/bin/gpg with a wrapper that strips those flags so the real gpg
          # falls back to the gpg-agent, which uses pinentry-env to supply the passphrase.
          sudo mv /usr/bin/gpg /usr/bin/gpg.real
          echo "" \
            | base64 -d | sudo tee /usr/bin/gpg > /dev/null
          sudo chmod +x /usr/bin/gpg

          # Configure rpmmacros (still set %__gpg in case a future rpm version reads it)
          {
            echo "%_gpg_path $HOME/.gnupg"
            echo "%_gpg_name kevin.inscoe@gmail.com"
            echo "%_signature gpg"
            echo "%__gpg /usr/bin/gpg"
          } > ~/.rpmmacros

      - name: Debug GPG setup
        run: |
          echo "=== /usr/bin/gpg first line ===" && head -1 /usr/bin/gpg
          echo "=== pinentry-pass byte count ===" && wc -c < ~/.gnupg/.pinentry-pass
          echo "=== test sign via agent ===" && echo "test" | gpg --batch --armor --sign --output /dev/null && echo "SIGN OK" || echo "SIGN FAILED"

      - name: Download, sign, and add .rpm files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rpms packages
          gh release download "${{ github.event.client_payload.tag }}" \
            --repo "${{ github.event.client_payload.repo }}" \
            --pattern "*.rpm" \
            --dir /tmp/rpms
          for rpm in /tmp/rpms/*.rpm; do
            rpmsign --addsign "$rpm"
            cp "$rpm" packages/
          done

      - name: Regenerate repo metadata
        run: createrepo_c --update .

      - name: Sign repo metadata
        run: gpg --batch --no-tty --detach-sign --armor repodata/repomd.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "add ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.tag }}"
          git push
