name: Add package

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install createrepo_c and rpm tools
        run: sudo apt-get install -y createrepo-c rpm

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust

          # Debug: confirm gpg version and current sign cmd macro
          gpg --version | head -1
          rpm --eval '%{__gpg_sign_cmd}' || true

          # Strip the passphrase from the ephemeral imported key so rpmsign
          # can call gpg non-interactively. rpmsign supplies an empty string
          # via --passphrase-fd 3 when there is no TTY; a passphrase-free key
          # accepts that empty value.
          # --passwd is the gpg 2.x shortcut for edit-key passwd.
          printf '%s\n\n\n' "$GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --passwd "$FINGERPRINT"

          # Configure rpmmacros for rpmsign
          {
            echo "%_gpg_path $HOME/.gnupg"
            echo "%_gpg_name kevin.inscoe@gmail.com"
            echo "%_signature gpg"
            echo "%__gpg /usr/bin/gpg"
          } > ~/.rpmmacros

      - name: Download, sign, and add .rpm files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rpms packages
          gh release download "${{ github.event.client_payload.tag }}" \
            --repo "${{ github.event.client_payload.repo }}" \
            --pattern "*.rpm" \
            --dir /tmp/rpms
          for rpm in /tmp/rpms/*.rpm; do
            rpmsign --addsign "$rpm"
            cp "$rpm" packages/
          done

      - name: Regenerate repo metadata
        run: createrepo_c --update .

      - name: Sign repo metadata
        run: gpg --batch --no-tty --detach-sign --armor repodata/repomd.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "add ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.tag }}"
          git push
