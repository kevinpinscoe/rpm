name: Add package

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install createrepo_c and rpm tools
        run: sudo apt-get install -y createrepo-c rpm

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg ~/.local/bin && chmod 700 ~/.gnupg

          # Custom pinentry that serves the passphrase from a file via the
          # Assuan protocol — same approach as the apt repo's working workflow.
          # Base64-encoded to avoid heredoc/indentation issues in YAML block scalars.
          echo "" \
            | base64 -d > ~/.local/bin/pinentry-env
          chmod +x ~/.local/bin/pinentry-env

          # Write passphrase to file; strip any trailing \r or \n (op CLI appends \n)
          printf '%s' "$GPG_PASSPHRASE" | tr -d '\r\n' > ~/.gnupg/.pinentry-pass
          chmod 600 ~/.gnupg/.pinentry-pass

          # Kill any running agent; wait for socket to disappear before writing config
          gpgconf --kill gpg-agent 2>/dev/null || true
          SOCK=$(gpgconf --list-dirs agent-socket 2>/dev/null || true)
          [ -n "$SOCK" ] && timeout 3 bash -c "while [ -S '$SOCK' ]; do sleep 0.1; done" || true
          printf 'pinentry-program %s/.local/bin/pinentry-env\n' "$HOME" > ~/.gnupg/gpg-agent.conf
          gpgconf --launch gpg-agent

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust

          # Configure rpmmacros for rpmsign.
          # %__gpg_sign_cmd drops --passphrase-fd so gpg uses the agent
          # (and thus our pinentry-env) instead of the passphrase rpmsign
          # reads from its non-existent TTY.
          {
            echo "%_gpg_path $HOME/.gnupg"
            echo "%_gpg_name kevin.inscoe@gmail.com"
            echo "%_signature gpg"
            echo "%__gpg /usr/bin/gpg"
            echo "%__gpg_sign_cmd /usr/bin/gpg --batch --no-verbose --no-armor -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}"
          } > ~/.rpmmacros

      - name: Download, sign, and add .rpm files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rpms packages
          gh release download "${{ github.event.client_payload.tag }}" \
            --repo "${{ github.event.client_payload.repo }}" \
            --pattern "*.rpm" \
            --dir /tmp/rpms
          for rpm in /tmp/rpms/*.rpm; do
            rpmsign --addsign "$rpm"
            cp "$rpm" packages/
          done

      - name: Regenerate repo metadata
        run: createrepo_c --update .

      - name: Sign repo metadata
        run: gpg --batch --detach-sign --armor repodata/repomd.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "add ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.tag }}"
          git push
