name: Add package

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install createrepo_c and rpm tools
        run: sudo apt-get install -y createrepo-c rpm

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust

          # Strip the passphrase from the ephemeral key so rpmsign works
          # without a TTY.  rpmsign's default %__gpg_sign_cmd uses
          # --passphrase-fd 3 with an empty string (no TTY in CI), so the
          # key must also have no passphrase for that to succeed.
          #
          # tr -d '\r\n' is critical: op CLI and some secret stores append
          # a trailing \n (or \r\n) that would make the passphrase wrong.
          # Kill any stale agent first so --pinentry-mode loopback reads
          # directly from --passphrase-fd 0 without interference.
          gpgconf --kill gpg-agent 2>/dev/null || true
          SOCK=$(gpgconf --list-dirs agent-socket 2>/dev/null || true)
          [ -n "$SOCK" ] && timeout 3 bash -c "while [ -S '$SOCK' ]; do sleep 0.1; done" || true
          CLEAN=$(printf '%s' "$GPG_PASSPHRASE" | tr -d '\r\n')
          printf '%s\n\n\n' "$CLEAN" | \
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --passwd "$FINGERPRINT"

          # Configure rpmmacros for rpmsign
          {
            echo "%_gpg_path $HOME/.gnupg"
            echo "%_gpg_name kevin.inscoe@gmail.com"
            echo "%_signature gpg"
            echo "%__gpg /usr/bin/gpg"
          } > ~/.rpmmacros

      - name: Download, sign, and add .rpm files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rpms packages
          gh release download "${{ github.event.client_payload.tag }}" \
            --repo "${{ github.event.client_payload.repo }}" \
            --pattern "*.rpm" \
            --dir /tmp/rpms
          for rpm in /tmp/rpms/*.rpm; do
            rpmsign --addsign "$rpm"
            cp "$rpm" packages/
          done

      - name: Regenerate repo metadata
        run: createrepo_c --update .

      - name: Sign repo metadata
        run: gpg --batch --no-tty --detach-sign --armor repodata/repomd.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "add ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.tag }}"
          git push
